[package]
name = "dancing_links_sudoku"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Generates Sudoku boards using the dancing links algorithm"
readme = "README.md"
repository = "https://github.com/ArmanDris/dancing_links_sudoku"
keywords = ["sudoku", "dancing_links", "algorithm_x", "exact_cover"]
categories = ["algorithms"]
exclude = [
  "AGENTS.md",
  "COMMAND_CHEATSHEET.md",
  "commit_directory.sh",
  "get_review_comments.sh",
  "test_then_publish_pr.sh",
  "human_v_agent_quality_notes/*",
  "benchmarks.md",
]

[dependencies]
rand = "0.8"
getrandom = { version = "0.2", optional=true }

[features]
default = []
js-random = ["getrandom/js"]

[dev-dependencies]
wasm-bindgen-test = "0.3.70"
